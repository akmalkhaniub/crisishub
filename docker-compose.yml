# Local stack for build steps 1-5. Host ports: gateway 8080 (later) · case 8081 · audit 8084 ·
# Keycloak 8180 · MySQL 3306 · Redis 6379 · Kafka 9092 · DynamoDB-local 8000.
#   docker compose up -d --build
name: incident-response

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-dev-only
      MYSQL_DATABASE: cases
      MYSQL_USER: ir
      MYSQL_PASSWORD: ir
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uir", "-pir"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Kafka 4.x: KRaft mode, no ZooKeeper. Containers use kafka:29092, the host uses localhost:9092.
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # Used from build step 6 (notification unread counts, caches).
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  # KC_HOSTNAME pins every token's `iss` to the URL the browser uses, so tokens obtained on the
  # host validate inside containers too. Containers fetch keys via keycloak:8080 (backchannel).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: kcadmin-dev-only
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      IR_CASE_SERVICE_SECRET: ${IR_CASE_SERVICE_SECRET:-dev-only-change-me}
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  case-service:
    build:
      context: .
      args: { MODULE: case-service }
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cases
      KAFKA_BOOTSTRAP: kafka:29092
      KEYCLOAK_ISSUER: http://localhost:8180/realms/incident-response
      KEYCLOAK_JWKS: http://keycloak:8080/realms/incident-response/protocol/openid-connect/certs
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  audit-service:
    build:
      context: .
      args: { MODULE: audit-service }
    ports: ["8084:8084"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AUDIT_CREATE_TABLE: "true"
      KEYCLOAK_ISSUER: http://localhost:8180/realms/incident-response
      KEYCLOAK_JWKS: http://keycloak:8080/realms/incident-response/protocol/openid-connect/certs
    depends_on:
      kafka: { condition: service_healthy }
      dynamodb: { condition: service_started }
      keycloak: { condition: service_healthy }
